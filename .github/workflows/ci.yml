name: CI

# Runs the full test suite on development after every merge, on pull requests into main
# (the manual promotion step), and on demand. Pull requests into development are tested by
# auto-merge.yml, which also merges them when they pass.

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
