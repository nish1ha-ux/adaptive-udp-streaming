<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive UDP Streaming</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Adaptive UDP Streaming</h1>
      <p id="proto" class="muted">Loading protocol info…</p>
    </header>

    <section class="card">
      <h2>Send a file over UDP (loopback)</h2>
      <form id="form">
        <label>File <input type="file" id="file" required></label>
        <div class="grid">
          <label>Reliability
            <select id="arq">
              <option value="stop-and-wait">Stop-and-Wait ARQ</option>
              <option value="none">None (blast)</option>
            </select>
          </label>
          <label>Packet interval (s) <input type="number" id="interval" value="0.001" min="0" max="1" step="0.001"></label>
          <label>Max retries <input type="number" id="max_retries" value="5" min="0" max="20"></label>
          <label>Initial RTO (s) <input type="number" id="initial_rto" value="1" min="0.2" max="10" step="0.1"></label>
        </div>
        <button type="submit" id="run">Run transfer</button>
        <span id="status" class="muted" role="status"></span>
      </form>
    </section>

    <section class="card" id="result" hidden>
      <h2>Result</h2>
      <p id="verdict"></p>
      <dl id="stats"></dl>
    </section>

    <section class="card">
      <h2>History</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Time</th><th>File</th><th>Bytes</th><th>Packets</th><th>Retrans.</th><th>Elapsed (s)</th><th>Goodput (kbps)</th><th>OK</th></tr></thead>
          <tbody id="history"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
